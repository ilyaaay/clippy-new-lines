[package]
name = "clippy-new-lines"
version = "0.1.0"
edition = "2024"
description = "Check new lines from VCS for clippy"
license = "MIT"
repository = "https://github.com/ilyaaay/clippy-new-lines"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1
